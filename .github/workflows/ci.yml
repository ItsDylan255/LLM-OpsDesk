# CI: Bei jedem Push und Pull Request prüft GitHub automatisch, ob alles noch funktioniert.
# Es wird nur der Mock-Provider benutzt: kein API-Key nötig, keine Kosten.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Älteste unterstützte Version (siehe requires-python) und die aktuelle
        python-version: ["3.10", "3.14"]

    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Projekt installieren
        run: pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -v

      - name: Auswertung aller Prompt-Varianten mit dem Mock (prüft, dass die ganze Kette läuft)
        run: llmopsdesk-eval --provider mock --task all --no-save

      - name: Suche in der Wissensbasis messen (ohne Modell, kostenlos)
        run: llmopsdesk-retrieval

      - name: Injection-Tests (Mock prüft Maskierung und Tag-Entschärfung)
        run: llmopsdesk-injection --task ticket-v3 --strict

  docker:
    # Baut das Image und startet es genau so wie docker-compose.yml (inkl. Härtung)
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Image bauen und Container starten
        run: docker compose up -d --build app

      - name: Warten, bis /health antwortet
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker compose logs app
          exit 1

      - name: Läuft nicht als root
        run: test "$(docker compose exec -T app id -u)" != "0"

      - name: Analyse über die JSON-API (Mock) und Log trotz schreibgeschütztem Dateisystem
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/analyze \
            -H "Content-Type: application/json" \
            -d '{"text": "SSH auf web01 hängt", "task": "ticket-v3"}' | grep '"category":"network"'
          docker compose exec -T app test -s /app/logs/metrics.csv

      - name: Aufräumen
        if: always()
        run: docker compose down -v
